name: Repository safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan tracked files
        shell: pwsh
        run: ./scripts/check-repository-safety.ps1

      - name: Create disposable local configuration
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -BaseUrl https://aio.example.com

      - name: Validate Docker Compose
        run: docker compose config --quiet
